<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小镇青年模拟器</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #1b1d21; color: #f2efe8;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
  user-select: none; -webkit-user-select: none; touch-action: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

#hud { position: fixed; inset: 0; pointer-events: none; }
#where {
  position: absolute; left: 16px; top: 14px; padding: 10px 14px; border-radius: 10px;
  background: rgba(20, 22, 26, 0.55); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}
#where .town { font-size: 12px; letter-spacing: 4px; opacity: 0.75; }
#place { font-size: 22px; font-weight: bold; margin-top: 2px; }
#tod { font-size: 12px; opacity: 0.75; margin-top: 2px; }

#minimap {
  position: absolute; right: 16px; top: 14px; width: 200px; height: 200px; border-radius: 50%;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
}
#speedo { position: absolute; right: 30px; bottom: 22px; width: 170px; height: 170px; }

#help {
  position: absolute; left: 16px; bottom: 16px; padding: 10px 14px; border-radius: 10px;
  background: rgba(20, 22, 26, 0.55); font-size: 12px; line-height: 1.9;
  display: grid; grid-template-columns: auto auto; column-gap: 18px; transition: opacity 0.3s;
}
#help b { grid-column: 1 / 3; font-size: 13px; letter-spacing: 2px; }
#help.hide { opacity: 0; }
#help .dim { opacity: 0.6; }
kbd {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-right: 3px; border-radius: 4px;
  background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25);
  font-family: inherit; font-size: 11px; line-height: 17px; text-align: center;
}

#toast {
  position: absolute; left: 50%; top: 22%; transform: translate(-50%, -10px); padding: 8px 18px;
  border-radius: 20px; background: rgba(20, 22, 26, 0.7); font-size: 15px; opacity: 0; transition: all 0.25s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

#bigmap {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
  background: rgba(15, 16, 19, 0.6); pointer-events: none;
}
#bigmap.show { display: flex; }
#bigmap canvas { width: min(82vmin, 660px); height: min(82vmin, 660px); border-radius: 12px; box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5); }
#bigmap p { margin: 10px 0 0; font-size: 13px; opacity: 0.8; }

#loading, #start {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
  background: radial-gradient(ellipse at center, rgba(40, 44, 50, 0.55), rgba(15, 16, 19, 0.85));
}
#loading { background: #1b1d21; z-index: 3; transition: opacity 0.4s; }
#loading.hide { opacity: 0; pointer-events: none; }
#loading h1 { font-size: 30px; letter-spacing: 6px; margin: 0 0 10px; }
#loading p { opacity: 0.7; }
#start { display: none; z-index: 2; }
#start.show { display: flex; }
#start .card {
  max-width: 460px; margin: 16px; padding: 28px 30px; border-radius: 14px; text-align: center;
  background: rgba(24, 26, 30, 0.82); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); line-height: 1.8;
}
#start h1 { margin: 0; font-size: 30px; letter-spacing: 6px; }
#start .sub { margin: 4px 0 14px; color: #f2c230; }
#start p { font-size: 14px; }
#start .dim { opacity: 0.55; font-size: 12px; }
#goBtn {
  margin-top: 10px; padding: 11px 28px; border: 0; border-radius: 24px; cursor: pointer;
  background: #f2c230; color: #2b2410; font-size: 17px; font-weight: bold; font-family: inherit; letter-spacing: 2px;
}
#goBtn:hover { background: #ffd451; }

#touch { display: none; }
@media (pointer: coarse) {
  #help { display: none; }
  #speedo { bottom: auto; top: 222px; right: 31px; width: 140px; height: 140px; }
  #minimap { width: 170px; height: 170px; }
  #touch {
    display: flex; justify-content: space-between; position: fixed; left: 0; right: 0; bottom: 0;
    padding: 16px; pointer-events: none;
  }
  #touch .left, #touch .right { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
  #touch button {
    width: 76px; height: 76px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35);
    background: rgba(20, 22, 26, 0.45); color: #fff; font-size: 24px; font-family: inherit; touch-action: none;
  }
  #touch button.small { width: 56px; height: 56px; font-size: 14px; }
  #touch button.gas { width: 92px; height: 92px; background: rgba(242, 194, 48, 0.45); }
  #touch button.on { background: rgba(255, 255, 255, 0.35); }
}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>

<div id="hud">
  <div id="where">
    <div class="town">青石镇</div>
    <div id="place">人民路</div>
    <div id="tod">上午</div>
  </div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <canvas id="speedo" width="170" height="170"></canvas>
  <div id="help">
    <b>操作</b>
    <span><kbd>W</kbd><kbd>↑</kbd> 加速</span>
    <span><kbd>S</kbd><kbd>↓</kbd> 刹车 / 倒车</span>
    <span><kbd>A</kbd><kbd>D</kbd> 转向</span>
    <span><kbd>空格</kbd> 急刹</span>
    <span><kbd>H</kbd> 按喇叭</span>
    <span><kbd>C</kbd> 切换镜头</span>
    <span><kbd>T</kbd> 切换时间</span>
    <span><kbd>B</kbd> 挡风被</span>
    <span><kbd>M</kbd> 大地图</span>
    <span><kbd>R</kbd> 回到起点</span>
    <span>鼠标拖动 环顾四周</span>
    <span class="dim"><kbd>I</kbd> 隐藏帮助</span>
  </div>
  <div id="toast"></div>
</div>

<div id="bigmap"><canvas id="bigmapCanvas" width="660" height="660"></canvas><p>青石镇地图（按 M 关闭）</p></div>

<div id="touch">
  <div class="left">
    <button data-key="KeyA">◀</button>
    <button data-key="KeyD">▶</button>
  </div>
  <div class="right">
    <button data-key="KeyH" class="small">喇叭</button>
    <button data-key="KeyS">刹</button>
    <button data-key="KeyW" class="gas">油</button>
  </div>
</div>

<div id="loading"><h1>小镇青年模拟器</h1><p>正在生成青石镇……</p></div>
<div id="start">
  <div class="card">
    <h1>小镇青年模拟器</h1>
    <p class="sub">青石镇 · 骑上你的小电驴，在镇上随便转转</p>
    <p>沿着人民路往东是农贸市场，往北有中心小学，<br>往南过了青石桥就是河对岸的村子。<br>文化广场上的阿姨们已经开始跳广场舞了。</p>
    <button id="goBtn">骑上车，出发</button>
    <p class="dim">WASD / 方向键骑车 · 按 Enter 开始</p>
  </div>
</div>
